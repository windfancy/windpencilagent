[workspace]
resolver = "2"
members = [
    "crates/wpa-api",
    "crates/plugin-abi",
    "crates/browser-core",
    "crates/wpa-kit",
    "crates/plugin-host",
    "crates/kern-core",
    "crates/base-store",
    "crates/toolkit-core",
    "crates/base-llm",
    "crates/agent-core",
    "crates/shell-core",
    "crates/workspace-core",
    "crates/knowledge-core",
    "crates/data-core",
    "crates/tree-core",
    "crates/net-core",
    "crates/text-core",
    "crates/wpa-engine",
    "crates/wpa-desktop",
    "crates/wpa-cli",
]

# 依赖方向铁律（CI 检查）：
# 1) 本 workspace 任何 crate 不得依赖 pentest-tree 或任何 feat-*/ext-* 业务 crate；
# 2) 基座不认识任何专业领域词汇，只认 wpa-api 的群组契约。

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
# 非商业许可：个人/研究/教学免费，商业用途需事先书面授权。
# 见根目录 LICENSE。Cargo 不接受自定义 SPDX 标识符，故用 license-file
# 指向全文；子 crate 通过 `license-file.workspace = true` 继承。
license-file = "LICENSE"
authors = ["windpencilagent Team"]

[workspace.dependencies]
# 收窄自 full：代码审计确认仅用下列 9 个模块。
# 去掉 full 附带的 signal / io-std / parking_lot（全项目零引用），
# 其中 signal 会额外拉入 signal-hook-registry，是传递依赖的主要冗余。
# 第三方 crate（reqwest/hyper 等）若需要其他 feature，cargo 的 feature 联合会自动补上，
# 不影响其编译。
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "io-util",
    "net",
    "fs",
    "process",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
sled = "0.34"


# 不要加 "cookies"：本项目所有 Cookie 都由 browser-core::CookieJar 自己实现
#（reqwest 的 Jar 只写不给读，导不出会话），cookies feature 会白拉 cookie_store + publicsuffix
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4", "serde"] }
indexmap = { version = "2", features = ["serde"] }
futures-util = "0.3"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
regex = "1"

[profile.dev]
# debug 构建只保留行号表，避免巨型 PDB（实测单个 454MB）拖垮链接阶段内存
debug = 1

[profile.release]
lto = "thin"
strip = true
# 减小 release 体积：单 codegen 单元提升优化密度；"s" 在体积/速度间取平衡
codegen-units = 1
opt-level = "s"
