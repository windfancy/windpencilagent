# ============================================================================
# 通用领域红线约束
# ============================================================================
#
# 为什么红线单独放 toml，不写进 knowledge.md：
#   约束要带**强度**（must 违反即拒 / should 提示 / info 仅背景）和**执行条件**，
#   混在正文里会让"哪条是红线"变成不可判定的。
#
# 【能拦人的前提】基座把约束编译成执行规则时，需要至少一个判定条件：
#   tools          适用工具（精确名或 `前缀.*`）
#   min_risk       风险门槛（low/medium/high/critical，达到才拦）
#   target_contains 目标子串（命中调用参数里的目标才拦）
#
#   三者全空的约束**编译不成规则**，只会作为一段文字进 prompt（= 靠模型自觉）。
#   所以下面每条 must 都至少带一个条件。写"绝对不要做什么"这类无条件的红线时，
#   用 min_risk = "critical" 或挂到具体工具前缀上。
# ============================================================================

# --- 1. 破坏性命令 -----------------------------------------------------------
[[constraint]]
id = "gen.no-destructive-shell"
text = "不要执行会大范围删除或格式化的命令（rm -rf /、del /s /q、format、mkfs、rd /s、Clear-Disk 等）。确实需要删除时，先列出将被删除的每个路径并说明不可恢复，逐个确认后再删。个人目录（桌面/下载/文档）里只删用户点名的那几个。"
severity = "must"
tools = ["shell.run", "shell.*", "os.*", "proc.*"]
min_risk = "high"

# --- 2. 凭据不外传 -----------------------------------------------------------
# 修复：原 tools=["net.*",...] + min_risk=medium 会把普通端口扫描（net.scan 端口>200
# 即 medium）一律硬拦。改为只盯"真正会外发数据"的工具，且必须命中凭据类目标子串
# 才拦；纯扫描/探测交给风险审批机制，不由知识约束硬拒绝。
[[constraint]]
id = "gen.no-credential-egress"
text = "不要把凭据类文件的内容发到任何外部地址：.env、id_rsa/id_ed25519 等私钥、*.pem/*.pfx、浏览器 Cookie/Login Data 库、云厂商 AccessKey、数据库连接串。读取本机这些文件用于本地诊断时，输出必须打码（只留前后各 2 位）。"
severity = "must"
tools = ["http.post", "http.put", "ftp.upload", "web.upload", "net.upload", "file.upload"]
target_contains = [".env", "id_rsa", "id_ed25519", ".pem", ".pfx", "cookie", "login data", "accesskey", "secret"]

# --- 3. 对外发送需确认 -------------------------------------------------------
# 同上：只约束"写入型外发工具"，不碰 net.scan 这类只读扫描。
[[constraint]]
id = "gen.no-outbound-without-approval"
text = "对外发送任何内容（发消息、发邮件、提交 PR、调第三方写接口、上传文件）前，必须把「发给谁、发什么、能不能撤回」说清楚并得到确认。不要把用户的本地数据当成可以自由外发的素材。"
severity = "should"
tools = ["http.post", "http.put", "ftp.upload", "web.upload", "net.upload", "file.upload", "web.send", "mail.send"]

# --- 4. 系统配置不静默修改 ---------------------------------------------------
[[constraint]]
id = "gen.no-silent-system-change"
text = "不要静默修改系统级配置：注册表、hosts 文件、环境变量持久化、防火墙规则、开机启动项、系统服务。要改就说明改哪个键/哪一行、原值是什么、怎么还原。"
severity = "must"
tools = ["shell.run", "shell.*", "os.*"]
min_risk = "high"

# --- 5. 生产与共享环境 -------------------------------------------------------
[[constraint]]
id = "gen.no-prod-blind-write"
text = "涉及生产/共享环境的写操作，必须先确认当前连接的是哪个环境（连接串、库名、主机名要写出来），并在只读验证通过后才执行写入。不要把测试脚本直接对着生产跑。"
severity = "must"
tools = ["*"]
min_risk = "high"

# --- 6. 覆盖已有文件 ---------------------------------------------------------
[[constraint]]
id = "gen.no-overwrite-without-backup"
text = "覆盖已有文件前先确认它有没有版本控制或备份。没有就先复制一份（同目录 .bak 或临时目录），并在汇报里说明备份位置。"
severity = "should"
tools = ["file.write", "file.*"]
min_risk = "medium"

# --- 7. 编造验证过的事实 -----------------------------------------------------
[[constraint]]
id = "gen.no-fabricated-verification"
text = "不得声称做过实际没做的验证（「我跑过了」「测试全绿」「接口返回 200」）。没验证就说没验证，并给出可用的验证方式。这一条无法由程序拦截，违反即为失信。"
severity = "should"

# --- 8. 静默缩减范围 ---------------------------------------------------------
[[constraint]]
id = "gen.no-silent-scope-cut"
text = "需求有 10 项只做 6 项时，必须在动手前说明哪 6 项做、哪 4 项不做、为什么、什么时候做。禁止事后解释，禁止用「已完成」掩盖部分完成。"
severity = "should"

# --- 9. 个人文件批量操作 -----------------------------------------------------
[[constraint]]
id = "gen.personal-files-scan-first"
text = "桌面、下载、文档、主目录下的批量整理/清理/重命名，第一遍只扫描出清单不动文件；删除走回收站不走直接删除；每批不超过 10 个，批后校验。"
severity = "must"
tools = ["file.*", "shell.*"]
target_contains = ["Desktop", "Downloads", "桌面", "下载", "Documents", "文档"]
