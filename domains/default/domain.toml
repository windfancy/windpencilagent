# ============================================================================
# 领域清单：通用对话（default）
# ============================================================================
#
# 领域是什么：一份**描述**，不是实体。它只有三个作用——
#   1. 声明「这个领域要用哪些组」（工具面 = 被引用组的并集）
#   2. 声明「这个领域的工作范式」（workflow.md，注入 system prompt）
#   3. 声明「这个领域的常识与红线」（knowledge.md / constraints.toml）
#
# 领域**不拥有**任何文件、不复制、不渲染目录、不安装插件。
# 切换领域 = 换一份工具面 + 换一段 prompt，不卸载任何 dll。
# 插件（dll）的生命周期只取决于「是否被任何 enabled 组引用」。
#
# 三个文件的分工（格式刻意不同，理由见 docs/完整功能设计与开发计划.md §6.4）：
#   workflow.md     自然语言，人写，注入 prompt —— 意图表达
#   knowledge.md    Markdown 条目，按 `## 标题` 切分 —— 常识检索
#   constraints.toml 结构化红线，可执行 —— 拦人
#   toolkit.toml    机器生成，只读 —— 工具清单唯一真相
# ============================================================================

[domain]
id = "default"
name = "通用对话"
version = "1.0.0"

# kind: general = 通用领域（无强流程约束，任意任务）
#       pack    = 专业领域包（可带阶段机，硬收敛工具面）
kind = "general"

description = "不预设专业方向的通用智能体。面向日常问答、文档处理、数据分析、脚本编写、本机文件与命令操作、联网检索与抓取。所有专业领域都是本领域的能力超集。"
summary = "什么都能聊、什么都能干，但不替你决定要干什么"

# ---------------------------------------------------------------------------
# 角色（persona）
#
# 这是**唯一**允许出现"你是谁"的地方。基座代码里不许出现领域角色。
# 规则：
#   - 只描述工作方式与判断标准，不描述能力（能力由 tools 决定，写在这里必然漂移）
#   - 不写"你是专家"这类无约束力的自我标榜，写可验证的行为要求
# ---------------------------------------------------------------------------
persona = """你是一个通用型智能体，服务于一位具体的人，而不是一个抽象的"用户"。

工作方式：
- 先弄清目标再动手。目标含糊时，问最少的问题把关键歧义消掉，不要靠猜；能自己查证的（读文件、看代码、搜一下）就不要问。
- 小事直接做，大事先给方案。涉及多步、有副作用、不可逆的操作，先说清楚要做什么、影响什么、怎么退回来，得到确认再执行。
- 结论必须有依据。你说"这个文件里没有 X"，前提是你真的读过它；你说"这样能跑"，前提是它真的跑过。做不到就说做不到。
- 说清楚你改了什么。改了哪个文件、影响哪段行为、怎么验证——这三件事必须能让人复述出来。
- 不确定的时候，宁可说"我不确定，但可以这样查证"，也不要把猜测写成结论。
"""

# ---------------------------------------------------------------------------
# 引用的组
#
# 顺序 = 工具在 prompt 里的呈现顺序（重要的组放前面）。
# 组不存在或未安装 ⇒ 装配期警告并跳过，不让整个领域失败。
# 空数组 = 纯对话领域（只有对话能力，无工具）。
# ---------------------------------------------------------------------------
groups = [
    "core",            # 回显 / 知识检索 / 阶段推进
    "file",            # 读 / 写 / 目录列举
    "shell",           # 命令执行 / 作业管理 / 持久 shell 会期
    "sandbox",         # 受限 Python / pip / os.exec
    "net",             # TCP 探测 / 端口扫描 / banner / DNS / HTTP
    "text",            # 编解码 / 哈希 / 正则 / 线索提取 / 文本变换
    "space",           # 工作空间（分项目隔离的记忆与文件根）
    "memory",          # 跨会话检索（session.search）
]

# 关于还没写进来的组：组名必须是**有工具实现**的组 id，写一个不存在的组
# 启动时会得到一条"声明了组 X 但没有任何工具属于它"的告警（防手滑）。
#   skill  —— 技能走 prompt 目录（渐进披露），不是工具，因此无组可引用
#   web    —— 无头浏览器目前只供插件通过 HostApi 使用，还没暴露成工具
# 需要这两个能力时，先让对应的组有工具实现，再把 id 加进上面的数组。

# ---------------------------------------------------------------------------
# 描述文件（路径相对本目录；留空 = 不启用该项）
# ---------------------------------------------------------------------------
workflow = "workflow.md"
knowledge = "knowledge.md"
constraints = "constraints.toml"

# 工具清单（机器生成，只读；由 `windpencilagent-cli registry export --domain default` 产出）
# 存在的意义：让"这个领域到底有哪些工具"成为可 diff、可审计的文件。
toolkit = "toolkit.toml"

# ---------------------------------------------------------------------------
# 阶段机（可选）
#
# 通用领域**不启用**阶段机：日常任务的流程差异太大，硬收敛工具面只会让模型
# 频繁卡在"当前阶段不允许用这个工具"上。
#
# 需要强流程的专业领域（如"受理→侦察→验证→交付"这种顺序固定且可审计的流程），
# 才启用 [[phase]]。本仓库只带通用领域，专业领域包按 docs/领域模板.md 自行扩展。
#
# 判定口径：一个领域的动作顺序**必须**一致且可审计 ⇒ 用阶段机；
#           否则只在 workflow.md 里写软流程。
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# 工具面修正（可选，保守使用）
#
# 组的并集有时过大（如 net 组 5 个工具，通用对话只需要 2 个）。
# 这里做**瘦身**，不做增补 —— 增补请改组引用，否则工具来源不可追溯。
#
# [tool_filter]
# drop = ["net.scan"]     # 从本领域工具面剔除（工具仍注册，其他领域可用）
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# 领域级参数（可选）
# ---------------------------------------------------------------------------
[params]
# 本领域是否允许 High/Critical 风险工具参与工具面。
# 通用领域开着（file.write / shell.run 都是 High），但每次调用仍走审批。
allow_high_risk = true
# 单轮工具调用上限（防失控）
max_tool_rounds = 24
